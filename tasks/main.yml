---
- block:
    - name: Install aminvakil.httpd_initial role from ansible-galaxy
      command: ansible-galaxy install aminvakil.httpd_initial
      register: result
      changed_when: '"already installed" not in result.stderr'
      delegate_to: localhost

    - name: Install apache
      include_role:
        name: aminvakil.httpd_initial
  when: httpd_initial | bool

- name: Check if apache2 is installed or not
  command: ls /etc/apache2
  register: result
  changed_when: false
  ignore_errors: true

- name: Fail when apache2 has not been installed
  assert:
    that:
      - result.rc == 0
      - '"No such" not in result.stdout'
    fail_msg: Apache has not been installed, use aminvakil.httpd_initial to install apache2 first.

- name: Fail when both http and https are false or true.
  assert:
    that:
      - (http | bool) or (https | bool)
      - not ((http | bool) and (https | bool))
    fail_msg: You should either enable http or https.

- name: Install aminvakil.create_user role from ansible-galaxy
  command: ansible-galaxy install aminvakil.create_user
  register: result
  changed_when: '"already installed" not in result.stderr'
  delegate_to: localhost

- name: Include create user role
  include_role:
    name: aminvakil.create_user
    allow_duplicates: no

- name: Include http only configuration
  include_tasks: http.yml
  when: http | bool

- name: Include https only configuration
  include_tasks: https.yml
  when: https | bool
