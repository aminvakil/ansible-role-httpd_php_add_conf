---
name: CI
'on':
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

defaults:
  run:
    working-directory: 'aminvakil.httpd_add_vhost'

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v2
        with:
          path: 'aminvakil.httpd_add_vhost'

      - name: Set up Python 3.
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install test dependencies.
        run: pip3 install yamllint ansible-base ansible-lint ansible

      - name: Lint code.
        run: |
          yamllint .
          ansible-lint .

  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian10
            httpd_initial: true
            http: true
            https: false
          - distro: debian10
            httpd_initial: true
            http: false
            https: true

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v2
        with:
          path: 'aminvakil.httpd_add_vhost'

      - name: Set up Python 3.
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install test dependencies.
        run: pip3 install ansible molecule[docker] docker

      - name: Run Molecule tests.
        run: molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}
          HTTPD_INITIAL: ${{ matrix.httpd_initial }}
          HTTP: ${{ matrix.http }}
          HTTPS: ${{ matrix.https }}
