---
- name: Enable proxy_fcgi module
  community.general.apache2_module:
    name: proxy_fcgi
    state: present
  notify: restart apache2

- name: Create php-fpm conf
  template:
    src: templates/etc/php/7.3/fpm/pool.d/php.conf.j2
    dest: /etc/php/7.3/fpm/pool.d/{{ user_name }}.conf
    mode: 0600
  notify: restart php-fpm
