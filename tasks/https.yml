---
- name: Enable rewrite module
  community.general.apache2_module:
    name: rewrite
    state: present
  notify: restart apache2

- name: Create Apache conf (http redirect to https) for website
  template:
    src: templates/etc/apache2/sites-available/https.conf.j2
    dest: /etc/apache2/sites-available/{{ user_name }}.conf
    mode: '0640'
  notify: restart apache2

- name: Create symlink for Apache conf (https)
  file:
    src: /etc/apache2/sites-available/{{ user_name }}.conf
    dest: /etc/apache2/sites-enabled/{{ user_name }}.conf
    state: link
  notify: restart apache2

- name: Check if a certificate has been issued
  stat:
    path: /etc/apache2/md/domains/{{ domain_name }}/pubcert.pem
  register: cert
  tags: molecule-notest

- name: Wait for certificates
  block:
    - name: Restart service in order to perform changes
      systemd:
        name: apache2
        state: restarted

    - name: Wait for certificates
      wait_for:
        path: /etc/apache2/md/staging/{{ domain_name }}/pubcert.pem
  tags: molecule-notest
  when: not cert.stat.exists
