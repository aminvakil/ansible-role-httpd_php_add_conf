---
- name: Install apache
  include_role:
    name: aminvakil.lamp.httpd_initial
  when: httpd_initial | bool

- name: Check if apache2 is installed or not
  command: ls /etc/apache2
  register: result
  changed_when: false
  ignore_errors: true

- name: Fail when apache2 has not been installed
  assert:
    that:
      - result.rc == 0
      - '"No such" not in result.stdout'
    fail_msg: Apache has not been installed, use aminvakil.lamp to install apache2 first.

- name: Fail when both http and https are false or true.
  assert:
    that:
      - (http | bool) or (https | bool)
      - not ((http | bool) and (https | bool))
    fail_msg: You should either enable http or https.

- name: Include create user role
  include_role:
    name: aminvakil.lamp.create_user
    allow_duplicates: false

- name: Install apache2-suexec-pristine
  apt:
    name: apache2-suexec-pristine
    install_recommends: false
    state: present
  notify: restart apache2

- name: Enable necessary modules
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  notify: restart apache2
  loop:
    - suexec
    - proxy
    - proxy_http

- name: Include http only configuration
  include_tasks: http.yml
  when: http | bool

- name: Include https only configuration
  include_tasks: https.yml
  when: https | bool

- name: Install php
  include_role:
    name: aminvakil.lamp.php_initial
  when: php_initial | bool

- name: Check if php is installed or not
  command: ls /etc/php
  register: result
  changed_when: false
  ignore_errors: true

- name: Fail when php has not been installed
  assert:
    that:
      - result.rc == 0
      - '"No such" not in result.stdout'

- name: Include php configuration
  include_tasks: php.yml
  when: php | bool
