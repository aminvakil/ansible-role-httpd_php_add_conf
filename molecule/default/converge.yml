---
- name: Converge
  hosts: all
  vars:
    httpd_initial: "{{ lookup('env', 'HTTPD_INITIAL') }}"
    php_initial: "{{ lookup('env', 'PHP_INITIAL') }}"
    http: "{{ lookup('env', 'HTTP') }}"
    https: "{{ lookup('env', 'HTTPS') }}"
    cloudflare: "{{ lookup('env', 'CLOUDFLARE') }}"
    staging: "{{ lookup('env', 'STAGING') }}"
    php: "{{ lookup('env', 'PHP') }}"
  roles:
    - role: aminvakil.httpd_php_add_conf
